<style>
/* Page spacing */
body {
  margin: 30px;
  font-family: Arial, sans-serif;
} 

/* Smooth scrolling */
html {
  scroll-behavior: smooth;
} 

/* Page spacing */
.main { 
	margin-bottom: 10px;
	margin-top: 10px;
	margin-left: 10px;
	margin-right: 10px;
} 

.main p { 
	margin: 10px;
} 

.subheader { 
	font-size: 12px;
	font-style: italic;
	margin-left: 30px;
} 

/* Infobox */
.box {
  width: 300px;
  float: right;
  margin-left: 10px;
  margin-top: 10px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  background: #ffffff;
  padding: 10px;
  box-sizing: border-box;
  margin: 10px 0;
}
.box h1 {
	text-align: center;
	font-size:16px;
}

/* h2 should only be used when implementing a background color*/
.box h2 { 
  background-color: #D1C4E9;
  text-align: center;
  font-size: 14px;
} 
  
.subcatergories { 
	font-size: 12px;
	width: 95%;
	vertical-align: top;
}

.subcatergories td {
	padding-left: 30px;
}
.subcatergories th {
	vertical-align: top;
}

/* Figure styling */
.box img {
  display: block;
  max-width: 100%;
  margin: 0 auto;
}

.box figcaption {
  font-size: 12px;
  text-align: center;
  margin-top: 2px;
}

/* in text images*/ 
.intext { 
	background-color: #ffffff;
	box-sizing: border-box;
	margin-top: 10px;
	margin-bottom: 10px;
} 

.intext img { 
	display: block;
	max-width: 100%;
	text-align: center;
	border: 1px solid #ccc;
} 

.intext figcaption { 
	font-size: 12px;
	font-family: Arial;
	font-style: italic;
	padding: 5px;
} 
	
/* contents */
.contents { 
	border: 1px solid #ccc;
	float: left;
	width: 200px;
	margin-bottom: 10px;
	margin-right: 10px;
	background-color: #ffffff;
	font-size: 10px;
}

.contents h3 {
	background-color: #ccc;
	font-weight: bold;
	text-align: center;
	padding: 5px;
}
</style>
