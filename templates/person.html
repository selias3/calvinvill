<html lang="en">
<head>

<meta charset="UTF-8">
<title>Person Template</title>

<style>
/* Page spacing */
body {
  margin: 30px;
  font-family: Arial, sans-serif;
} 

/* Smooth scrolling */
html {
  scroll-behavior: smooth;
} 
</style>
</head>

<!-- Header -->

<h1 style="text-align:center;">
  <a href="index.html">
    <img src="images/emblem2.png" height="125" width="125" alt="Emblem">
  </a>
</h1>
<h2 style="font-family:Georgia; background-color:#D1C4E9;">Name of person here</h2>

<body>
<style>
/* Page spacing */

.main { 
	margin-bottom: 10px;
	margin-top: 10px;
	margin-left: 10px;
	margin-right: 10px;
} 

.main p { 
	margin: 10px;
} 

.subheader { 
	font-size: 12px;
	font-style: italic;
	margin-left: 30px;
} 

/* Infobox */
.box {
  width: 300px;
  float: right;
  margin-left: 10px;
  margin-top: 10px;
  margin-bottom: 10px;
  margin-right: 20px;
  border: 1px solid #ccc;
  background: #ffffff;
  padding: 10px;
  box-sizing: border-box;
}

.box h1 {
  background-color: #eee;
  text-align: center;
  font-size: 14px;
  padding: 10px;
} 

.subcatergories { 
	padding: 20px;
	font-size: 12px;
	margin-right: 20px;
}
  
/* Figure styling */
.person { 
  margin: 10px 0;
}

.person img {
  display: block;
  max-width: 100%;
	margin: 0 auto;
}

.person figcaption {
  font-size: 12px;
  text-align: center;
  margin-top: 5px;
}

/* in text images*/ 
.person-text { 
	background-color: #ffffff;
	border: 1px solid #ccc;
	box-sizing: border-box;
	margin: 10px;
} 

.person-text img { 
	display: block;
	max-width: 100%;
	padding: 2px;
} 

.person-text figcaption { 
	font-size: 12px;
	font-family: Arial;
	font-style: italic;
	padding: 5px;
} 
	
/* Accordion section */
.section {
  border: 1px solid #ccc;
  margin-bottom: 10px;
}

.header {
  background: #eee;
  padding: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 12px;
}

.content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  padding-left: 5px;
  font-size: 12px;
}

.content ul {
  list-style-type: none;
  padding-left: 0;
  margin: 5px 0;
}
</style>
